# El vigía suplente. Va en el repo TESTIGO, no en el del proyecto.
#
# Se ejecuta en el alojamiento, así que sigue funcionando con la máquina del observatorio
# apagada — que es el caso entero contra el que existe.
#
# Instalación: copiar este fichero al repo testigo como
#   .github/workflows/vigia-suplente.yml
# y `suplente/comprobar_resumen.py` como
#   .github/comprobar_resumen.py
name: vigia-suplente

on:
  schedule:
    # 15:23 UTC = 17:23 locales. La pasada empuja sobre las 05:45 UTC, así que esto deja
    # nueve horas de margen para una máquina que arrancó tarde. Ancho a propósito: un
    # suplente que avisa de mañanas que acaban bien se acaba silenciando.
    #
    # **Minuto 23 y no 0, y DOS veces, por algo que el alojamiento documenta:** al
    # principio de cada hora las ejecuciones programadas se retrasan y, con carga
    # suficiente, SE DESCARTAN. Estaba en «0 15», justo ahí: el día que la descartaran,
    # el suplente no correría el día que hacía falta. La segunda, a las 20:23 UTC, es la
    # última llamada: quedan 3 h 37 min de día UTC para sellarlo todavía.
    - cron: "23 15 * * *"
    - cron: "23 20 * * *"
  workflow_dispatch:
    inputs:
      simular_silencio:
        description: "SIMULACRO: forzar el aviso para ver que la alarma suena de verdad"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      # v5 y no v4: la v4 corre sobre Node 20, que está en retirada. Se sube antes de que
      # se convierta en fallo, porque el día que rompa lo hará en silencio y el suplente
      # dejará de correr justo cuando haga falta.
      - uses: actions/checkout@v5

      - id: mirar
        name: ¿Hay resumen de hoy?
        # `continue-on-error` a propósito: cuando hay silencio el script sale con código 2,
        # y aquí NO queremos que el trabajo se corte antes de dar el aviso. El rojo del
        # trabajo se pone al final, en el último paso.
        continue-on-error: true
        run: python .github/comprobar_resumen.py resumenes.txt

      # --- el simulacro -----------------------------------------------------
      #
      # Una alarma que nadie ha visto sonar no está comprobada. Esto fuerza el camino del
      # aviso SIN tocar nada del observatorio, para poder verlo entero una vez: la
      # incidencia, el correo, y el cierre.
      #
      # Usa un título distinto a propósito, para que un simulacro no se pueda confundir
      # nunca con un aviso de verdad ni cierre uno real por error.
      - id: decidir
        name: Qué toca hacer
        env:
          SIMULACRO: ${{ inputs.simular_silencio }}
          AVISAR: ${{ steps.mirar.outputs.avisar }}
          MOTIVO: ${{ steps.mirar.outputs.motivo }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            echo "avisar=si" >> "$GITHUB_OUTPUT"
            echo "titulo=SIMULACRO - prueba del vigia suplente" >> "$GITHUB_OUTPUT"
            echo "cuerpo=Esto es un SIMULACRO lanzado a mano. No pasa nada con el observatorio. Sirve para comprobar de una vez que la alarma llega: que se abre la incidencia y que el correo sale. Cierrala cuando la hayas visto." >> "$GITHUB_OUTPUT"
          else
            echo "avisar=${AVISAR}" >> "$GITHUB_OUTPUT"
            echo "titulo=El observatorio no ha sellado" >> "$GITHUB_OUTPUT"
            echo "cuerpo=${MOTIVO}" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decidir.outputs.avisar == 'si'
        name: Abrir o actualizar el aviso
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.decidir.outputs.titulo }}
          CUERPO: ${{ steps.decidir.outputs.cuerpo }}
          DUENO: ${{ github.repository_owner }}
        run: |
          # MENCIONA Y ASIGNA al dueño del repositorio, y eso no es cortesía.
          #
          # Medido el 2026-09-05: el simulacro abrió la incidencia, salió en verde, y
          # NO llegó ningún correo. La cuenta tenía el repositorio en «Participating»,
          # asi que de algo que abre un robot no se genera aviso ninguno — ni siquiera
          # dentro de GitHub. La alarma se disparó y no llegó a nadie.
          #
          # Una mención avisa con la configuración por defecto, y una asignación
          # también. Asi la entrega viaja DENTRO de la alarma, en vez de depender de un
          # ajuste por usuario que nadie revisa y que puede cambiar en silencio.
          #
          # Un aviso al día sería ruido: si ya hay uno abierto, se comenta en él.
          NUMERO=$(gh issue list --state open --search "$TITULO in:title" \
                     --json number --jq '.[0].number // empty')
          if [ -z "$NUMERO" ]; then
            gh issue create --title "$TITULO" --assignee "$DUENO" \
              --body "@$DUENO"$'\n\n'"$CUERPO"$'\n\n'"Lo dice el vigia suplente, que corre en este alojamiento y no en la maquina del observatorio. Comprueba esa maquina: el planificador, si estuvo encendida, y el registro de la tarea en \`archivo-strata/tareas/registro/\`."
          else
            gh issue comment "$NUMERO" --body "@$DUENO"$'\n\n'"$CUERPO"
          fi

      # --- los días perdidos ------------------------------------------------
      #
      # El aviso de arriba mira si hay resumen de HOY. Si un día se pierde y ese día este
      # flujo no llega a correr, al siguiente ya hay resumen nuevo y el aviso calla: el
      # día perdido no lo denunciaría nadie. La serie lo guarda, así que se mira la serie.
      #
      # Una incidencia POR DÍA, con la fecha en el título, y buscada en TODOS los estados:
      # se abre una vez y no se reabre nunca: un día sin medir no tiene arreglo y
      # reabrirlo cada tarde sería ruido. Si el día aparece después se cierra, pero SIN
      # decir por qué, porque desde aquí no se sabe: puede que el testigo empujara tarde,
      # o que la pasada no ocurriera y la del día siguiente lo sellara como NO OBSERVADO
      # (desde el 2026-09-12). La línea de resumenes.txt no distingue los dos casos.
      - name: Un aviso por cada día que falte en la serie
        env:
          GH_TOKEN: ${{ github.token }}
          HUECOS: ${{ steps.mirar.outputs.huecos }}
          DUENO: ${{ github.repository_owner }}
        run: |
          PREFIJO="Se perdio el dia "
          # Todas las de días perdidos, abiertas y cerradas, como «numero estado fecha».
          # La búsqueda del alojamiento es aproximada; el `select` exige el prefijo exacto.
          gh issue list --state all --limit 500 --search "Se perdio el dia in:title" \
             --json number,state,title \
             --jq ".[] | select(.title | startswith(\"$PREFIJO\")) | \"\(.number) \(.state) \(.title | ltrimstr(\"$PREFIJO\"))\"" \
             > conocidas.txt
          for DIA in $HUECOS; do
            if ! grep -q " $DIA\$" conocidas.txt; then
              gh issue create --title "$PREFIJO$DIA" --assignee "$DUENO" \
                --body "@$DUENO"$'\n\n'"En resumenes.txt no hay linea del $DIA y si las hay de dias posteriores: ese dia no llego a sellarse a su hora, o su resumen no llego a este alojamiento. Si la pasada no ocurrio, la del dia siguiente lo sella como NO OBSERVADO: existira en el archivo, pero ese dia no se midio. Compruebalo en archivo-strata/dias/ de la maquina del observatorio y cierra esta incidencia cuando conste por que."
            fi
          done
          # Las abiertas cuyo día ya NO falta: se cierran, diciendo qué pasó.
          while read -r NUM ESTADO DIA; do
            [ "$ESTADO" = "OPEN" ] || continue
            case " $HUECOS " in
              *" $DIA "*) ;;
              *) gh issue close "$NUM" --comment "El resumen del $DIA ha aparecido en la serie. Desde aqui no se distingue si llego tarde o si el dia se sello despues como NO OBSERVADO (la pasada no ocurrio): la cobertura del dia, en archivo-strata/dias/$DIA.jsonl, dice cual de las dos." ;;
            esac
          done < conocidas.txt

      - if: steps.decidir.outputs.avisar == 'no'
        name: Cerrar el aviso si lo hubiera
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMERO=$(gh issue list --state open --search "El observatorio no ha sellado in:title" \
                     --json number --jq '.[0].number // empty')
          if [ -n "$NUMERO" ]; then
            gh issue close "$NUMERO" --comment "Vuelve a haber resumen del dia: el observatorio ha sellado."
          fi

      # El trabajo tiene que quedar en ROJO cuando hay silencio de verdad: se ve en la
      # lista de ejecuciones sin abrir nada. Un simulacro NO pone rojo — si lo pusiera,
      # un ensayo sería indistinguible de una avería en el historial.
      - if: steps.decidir.outputs.avisar == 'si' && inputs.simular_silencio != true
        name: Y que conste como fallo
        run: |
          echo "::error::${{ steps.decidir.outputs.cuerpo }}"
          exit 1
